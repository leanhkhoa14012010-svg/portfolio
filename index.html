<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lê Anh Khoa | Personal Space</title>
    <style>
        /* Reset & Base */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html { scroll-behavior: smooth; overflow-x: clip; }
        body {
            min-height: 100vh; color: #fff; overflow-x: hidden; position: relative;
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            background:
              radial-gradient(ellipse 56% 62% at 14% 47%, rgba(17,52,104,.37), transparent 70%),
              radial-gradient(ellipse 43% 55% at 87% 69%, rgba(12,36,78,.33), transparent 80%),
              radial-gradient(ellipse 30% 35% at 54% 88%, rgba(35,36,65,.13), transparent 84%),
              #03060c;
        }
        #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        #home, #about, #contact { scroll-margin-top: 44px; }

        /* Loader */
        #loader {
            position: fixed; inset: 0; z-index: 99999; min-height: 100svh; color: #f6f8ff;
            background:
              radial-gradient(circle at 18% 18%, rgba(71,110,255,.16), transparent 30%),
              radial-gradient(circle at 82% 22%, rgba(61,191,255,.10), transparent 26%),
              radial-gradient(circle at 52% 82%, rgba(122,89,255,.08), transparent 30%),
              linear-gradient(135deg, #04070f 0%, #07111d 42%, #091526 68%, #060c17 100%);
            isolation: isolate; overflow: hidden;
            transition: opacity .78s cubic-bezier(.2,.75,.2,1), visibility .78s;
        }
        #loader.is-exiting { opacity: 0; visibility: hidden; pointer-events: none; }
        #loader .loader-bg, #loader .loader-glow, #loader .loader-grid, #loader .loader-noise, #loader .mars-v29 { position: absolute; inset: 0; pointer-events: none; }
        #loader .loader-bg { z-index: 0; background: radial-gradient(circle at 30% 40%, rgba(255,255,255,.03), transparent 18%), radial-gradient(circle at 72% 58%, rgba(255,255,255,.028), transparent 24%); }
        #loader .loader-glow { z-index: 1; filter: blur(24px); opacity: .95; }
        #loader .loader-glow::before, #loader .loader-glow::after {
            content: ""; position: absolute; border-radius: 999px;
            background: linear-gradient(90deg, rgba(120,171,255,0), rgba(120,171,255,.24), rgba(255,255,255,.02));
            animation: driftGlow 12s ease-in-out infinite alternate;
        }
        #loader .loader-glow::before { width: 42vw; height: 42vw; min-width: 280px; min-height: 280px; top: -14vw; right: -8vw; }
        #loader .loader-glow::after { width: 30vw; height: 30vw; min-width: 220px; min-height: 220px; bottom: -10vw; left: -10vw; animation-duration: 14s; animation-direction: alternate-reverse; }
        #loader .loader-grid {
            z-index: 1; opacity: .2;
            background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 130px 130px; mask-image: linear-gradient(180deg, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        #loader .loader-noise { z-index: 1; opacity: .055; mix-blend-mode: screen; background-image: radial-gradient(rgba(255,255,255,.8) .7px, transparent .8px); background-size: 18px 18px; }
        #loader .loader-shell { position: relative; z-index: 3; width: min(calc(100% - 40px), 1240px); height: 100%; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 4vh, 42px) 0 clamp(26px, 4vh, 40px); }
        #loader .loader-top { display: flex; align-items: center; gap: 20px; }
        #loader .loader-brand { display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; color: #eef3ff; font-size: 13px; font-weight: 800; letter-spacing: .14em; }
        #loader .loader-brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); font: 700 15px ui-monospace,SFMono-Regular,monospace; color: #d9e7ff; }
        #loader .loader-line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,.06), transparent); }
        #loader .loader-meta { font-size: 11px; letter-spacing: .22em; color: #c0cadf; white-space: nowrap; }
        #loader .loader-skip { display: inline-flex; align-items: center; gap: 8px; padding: 11px 17px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: #f6f8ff; cursor: pointer; font-size: 13px; font-weight: 650; backdrop-filter: blur(14px); transition: transform .2s ease, background .2s ease, border-color .2s ease; }
        #loader .loader-skip:hover { transform: translateY(-1px); background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.28); }
        #loader .loader-center { flex: 1; display: grid; align-content: center; gap: 22px; padding: 22px 0 28px; }
        #loader .loader-scene { position: relative; min-height: min(58vh, 620px); width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #loader .scene-halo { width: min(32vw, 420px); aspect-ratio: 1; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(113,164,255,.18), rgba(113,164,255,.06) 34%, rgba(113,164,255,0) 72%); filter: blur(4px); opacity: .85; animation: haloBreath 5s ease-in-out infinite; pointer-events: none; }
        #loader .scene-halo::before, #loader .scene-halo::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); pointer-events: none; }
        #loader .scene-halo::before { inset: 14% 12%; opacity: .5; }
        #loader .scene-halo::after { inset: -12%; border-color: rgba(255,255,255,.04); opacity: .65; }
        #loader .touch-flare { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%,-50%) scale(.45); border-radius: 50%; opacity: 0; background: radial-gradient(circle, rgba(255,255,255,.94) 0, rgba(168,207,255,.82) 28%, rgba(168,207,255,0) 68%); transition: opacity .32s ease, transform .44s cubic-bezier(.22,.76,.18,1.04); pointer-events: none; }
        #loader .touch-flare::before { content: ""; position: absolute; inset: -78px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,255,255,0) 0 12%, rgba(255,255,255,.7) 14%, rgba(255,255,255,0) 17% 31%, rgba(255,255,255,.55) 33%, rgba(255,255,255,0) 36% 100%); opacity: .52; filter: blur(3px); animation: spinSlow 9s linear infinite; pointer-events: none; }
        #loader.hands-touching .touch-flare { opacity: 1; transform: translate(-50%,-50%) scale(1.14); }
        #loader .hand-wrap { position: absolute; will-change: transform, opacity; }
        #loader .hand-wrap.left { left: max(-1vw, -12px); bottom: 18%; width: min(28vw, 390px); animation: leftReach 4.2s cubic-bezier(.22,.76,.16,.98) infinite both; }
        #loader .hand-wrap.right { right: max(-1vw, -14px); top: 18%; width: min(29vw, 408px); animation: rightReach 4.2s cubic-bezier(.22,.76,.16,.98) infinite both; }
        #loader .hand-img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; object-fit: contain; filter: drop-shadow(0 18px 30px rgba(0,0,0,.55)) drop-shadow(0 2px 1px rgba(255,247,233,.18)); }
        #loader .hand-wrap.left .hand-img { transform-origin: 78% 52%; animation: leftBreath 4.2s ease-in-out infinite; }
        #loader .hand-wrap.right .hand-img { transform-origin: 22% 50%; animation: rightBreath 4.2s ease-in-out infinite; }
        #loader .loader-copy { text-align: center; margin-top: -1vh; }
        #loader .loader-kicker { font-size: 11px; font-weight: 700; letter-spacing: .26em; color: #a7badf; margin-bottom: 14px; }
        #loader .loader-title { font-size: clamp(34px, 5vw, 60px); line-height: 1.02; letter-spacing: -.05em; font-weight: 780; color: #fbfdff; }
        #loader .loader-subtitle { margin: 14px auto 0; font-size: 14px; line-height: 1.75; color: #c9d4e8; max-width: 560px; }
        #loader .loader-bottom { display: grid; gap: 14px; width: min(100%, 760px); margin: 0 auto; }
        #loader .loader-statusrow { display: flex; align-items: end; gap: 14px; flex-wrap: wrap; }
        #loader .loader-status { font-size: 12px; letter-spacing: .18em; font-weight: 800; color: #eef4ff; }
        #loader .loader-time { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 12px; color: #7d8aa6; }
        #loader .loader-percent { margin-left: auto; font-size: clamp(30px, 4vw, 44px); font-weight: 800; letter-spacing: -.08em; font-variant-numeric: tabular-nums; }
        #loader .loader-track { height: 10px; border-radius: 999px; position: relative; overflow: hidden; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); }
        #loader .loader-fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: inherit; background: linear-gradient(90deg, #7cb5ff 0%, #b89dff 50%, #f4fcff 100%); transition: width .11s linear; }
        #loader .loader-footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; color: #7f8aa5; font-size: 11px; letter-spacing: .12em; }
        #loader .loader-credit { display: flex; align-items: center; gap: 10px; }
        #loader .loader-credit-dot { width: 6px; height: 6px; border-radius: 50%; background: #8fc6ff; }
        #loader #cinemaMarsSpin, #loader .gemini-cleanup { display: none !important; }
        #loader .mars-v29-system { position: absolute; right: -1.5vw; top: 14vh; width: min(46vw, 760px); aspect-ratio: 1 / 1; filter: contrast(1.16) saturate(1.12); }
        #loader .mars-v29-ring-back, #loader .mars-v29-ring-front { position: absolute; left: -35%; top: 49%; width: 108%; height: 18%; border-radius: 50%; transform: rotate(-14deg); transform-origin: 70% 50%; animation: marsRingDrift 26s ease-in-out infinite alternate; }
        #loader .mars-v29-ring-back { z-index: 0; opacity: .58; background: radial-gradient(ellipse at center, rgba(255,255,255,.22) 0 16%, rgba(245,239,231,.16) 22%, rgba(210,214,220,.1) 34%, transparent 64%), repeating-radial-gradient(ellipse at center, rgba(255,255,255,.16) 0 1px, transparent 1px 8px); filter: blur(1.2px); }
        #loader .mars-v29-ring-front { z-index: 4; opacity: .74; clip-path: inset(47% 0 0 0); background: linear-gradient(180deg, transparent 0 44%, rgba(255,255,255,.09) 47%, rgba(248,240,228,.45) 58%, rgba(255,255,255,.16) 66%, transparent 100%), repeating-radial-gradient(ellipse at center, rgba(255,255,255,.18) 0 1px, transparent 1px 8px); filter: blur(.8px); }
        #loader .mars-v29-planet { position: absolute; inset: 0; z-index: 2; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 32% 24%, rgba(255,241,218,.22), transparent 26%), #6e4c35; box-shadow: 0 24px 90px rgba(0,0,0,.46), inset -60px -28px 110px rgba(0,0,0,.34); }
        /* Nên thay chuỗi base64 dài bằng file ảnh thật như images/mars-texture.jpg */
        #loader .mars-v29-planet::before { content: ""; position: absolute; inset: 0; background-image: var(--mars-tex, none); background-size: cover; }

        @keyframes driftGlow { from { transform: translate3d(0,0,0); } to { transform: translate3d(22px,-16px,0); } }
        @keyframes haloBreath { 0%,100% { transform: translate(-50%,-50%) scale(.98); opacity: .75; } 50% { transform: translate(-50%,-50%) scale(1.05); opacity: .95; } }
        @keyframes spinSlow { to { transform: rotate(360deg); } }
        @keyframes marsRingDrift { from { transform: rotate(-15deg); } to { transform: rotate(-12deg); } }
        @keyframes leftReach { 0% { transform: translate(-18vw,12vh) rotate(12deg); opacity: 0; } 10% { opacity: 1; } 82% { transform: translate(-.3vw,.2vh) rotate(1.4deg); } 100% { transform: translate(1.2vw,-.4vh) rotate(0deg); opacity: 1; } }
        @keyframes rightReach { 0% { transform: translate(18vw,-12vh) rotate(-11deg); opacity: 0; } 10% { opacity: 1; } 82% { transform: translate(.2vw,-.2vh) rotate(-1deg); } 100% { transform: translate(-1.1vw,.8vh) rotate(.3deg); opacity: 1; } }
        @keyframes leftBreath { 0%,100% { transform: rotate(1deg) scale(1); } 50% { transform: rotate(-.8deg) scale(.998); } }
        @keyframes rightBreath { 0%,100% { transform: rotate(-1deg) scale(1); } 50% { transform: rotate(.8deg) scale(.998); } }

        /* Header & Glass Nav */
        header { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 100; width: max-content; max-width: calc(100vw - 24px); isolation: isolate; overflow: visible; }
        nav {
            position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; gap: 22px;
            padding: 7px 9px 7px 13px; border-radius: 999px;
            background: rgba(9, 20, 35, .22); border: 1px solid rgba(225, 238, 255, .49);
            -webkit-backdrop-filter: blur(8px) saturate(155%) brightness(1.14); backdrop-filter: blur(8px) saturate(155%) brightness(1.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.32), 0 15px 45px rgba(0,0,0,.36);
        }
        nav::before { content: ""; position: absolute; inset: 1px; z-index: 1; pointer-events: none; border-radius: inherit; background: radial-gradient(circle 110px at var(--lens-x, 50%) 0%, rgba(243,250,255,.19), transparent 86%); }
        nav::after { content: ""; position: absolute; top: 1px; left: 16%; width: 67%; height: 1px; z-index: 2; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(246,251,255,.68), transparent); }
        nav > a, nav > .sound-toggle { position: relative; z-index: 3; }
        nav a { padding: 10px 15px; border-radius: 22px; color: #f1f5fb; text-decoration: none; font-size: 14px; font-weight: 650; transition: color .2s, background .2s; }
        nav a:hover:not(.active) { color: #fff; background: rgba(255,255,255,.075); }
        nav a.active { color: #fff; border-radius: 999px; background: linear-gradient(145deg, rgba(105,157,235,.37), rgba(38,67,111,.43)); box-shadow: inset 0 1px 0 rgba(242,249,255,.35); }
        nav .sound-toggle { width: 35px; height: 35px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.12); background: rgba(235,245,255,.1); color: #cbd5e1; cursor: pointer; transition: .2s ease; }
        nav .sound-toggle:hover, nav .sound-toggle[aria-pressed="true"] { color: #93c5fd; border-color: rgba(96,165,250,.45); }
        nav .sound-toggle svg { width: 17px; height: 17px; }
        nav .nav-magnifier { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; pointer-events: none; z-index: 0; opacity: .35; }
        header .glass-mirror { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; border-radius: 999px; mask-image: radial-gradient(ellipse 80% 96% at 50% 50%,#000 38%,rgba(0,0,0,.9) 62%,transparent 99%); }
        header .glass-mirror-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; pointer-events: none; }
        header .glass-copy { position: absolute !important; transform: none !important; pointer-events: none !important; margin: 0 !important; }

        /* Hero & Lanyard */
        .container { position: relative; z-index: 10; max-width: 1180px; margin: 0 auto; padding: 0 32px; min-height: 100vh; display: grid; grid-template-columns: 1.05fr 0.95fr; align-items: center; gap: 24px; }
        .hero-left h1 { font-size: clamp(42px, 5vw, 66px); font-weight: 800; line-height: 1.15; letter-spacing: -.045em; margin-bottom: 16px; }
        .hero-left h1 span { display: block; color: #7fc2ff; }
        .typing-wrapper { font-size: 22px; color: #93c5fd; margin-bottom: 20px; height: 30px; font-weight: 600; }
        .hero-left p { color: #9ca3af; font-size: 15.5px; line-height: 1.65; max-width: 500px; margin-bottom: 32px; }
        .btn-group { display: flex; gap: 14px; }
        .btn-primary { display: inline-block; background: #3478ea; color: #fff; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14.5px; box-shadow: 0 6px 22px rgba(42,111,240,.18); }
        .btn-primary:hover { background: #4789fa; }
        .btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14.5px; }
        .find-me { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 25px; }
        .find-label { color: #8eb9ed; font-size: 10px; letter-spacing: 1.6px; font-weight: 900; }
        .social-icons { display: flex; align-items: center; gap: 10px; }
        .social-icon { width: 34px; height: 34px; color: #e7edf9; border-radius: 50%; border: 1px solid rgba(172,192,220,.2); background: rgba(15,24,42,.32); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: .2s ease; }
        .social-icon:hover, .social-icon:focus-visible { background: rgba(66,120,206,.19); border-color: rgba(129,182,255,.5); transform: translateY(-2px); }
        .social-icon svg { width: 17px; height: 17px; }

        .hero-right { height: 100vh; width: 100%; position: relative; display: flex; align-items: center; justify-content: center; isolation: isolate; }
        .hero-right::before { content: ""; position: absolute; inset: 10% -7%; border-radius: 50%; background: radial-gradient(ellipse, rgba(26,73,143,.21), rgba(16,43,83,.08) 42%, transparent 72%); z-index: 0; pointer-events: none; }
        #lanyardCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; touch-action: none; visibility: hidden; }
        .hero-right.three-ready #lanyardCanvas { visibility: visible; }
        .hero-right.three-ready .fallback-lanyard { display: none; }
        .lanyard-hit-zone { display: none; position: absolute; inset: 0; z-index: 3; cursor: grab; touch-action: none; user-select: none; }
        .hero-right.three-ready .lanyard-hit-zone { display: block; }
        .hero-right.dragging-card .lanyard-hit-zone, html.lanyard-dragging, html.lanyard-dragging * { cursor: grabbing !important; user-select: none !important; }

        /* Fallback Lanyard */
        .fallback-lanyard { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; transform: translateY(8%); pointer-events: none; }
        .fallback-badge { position: relative; width: min(300px,75%); aspect-ratio: 2/3; padding: 38px 15px 14px; border: 11px solid #1f2937; border-radius: 15px; background: #f6f7f7; color: #162441; box-shadow: 0 17px 50px rgba(0,0,0,.42); transform: rotate(-3deg); }
        .fallback-badge::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(27,59,109,.042) 1px,transparent 1px),linear-gradient(90deg,rgba(27,59,109,.042) 1px,transparent 1px); background-size: 22px 22px; }
        .fallback-slot { position: absolute; z-index: 2; top: 7px; left: 37%; width: 26%; height: 13px; border-radius: 30px; background: #04060c; }
        .fallback-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; position: relative; z-index: 1; }
        .fallback-top strong { background: #77bdf1; font-size: 10px; padding: 5px 9px; border-radius: 4px; }
        .fallback-top span { text-align: right; font-size: 8px; font-weight: 800; line-height: 1.3; color: #253d5d; }
        .fallback-title { position: relative; z-index: 1; font-size: clamp(26px,3vw,36px); font-weight: 950; letter-spacing: -.04em; margin: 10px 0 8px; color: #17294b; }
        .fallback-photo { position: relative; z-index: 1; height: 68%; overflow: hidden; border-radius: 7px; background: #dfe4e7; }
        .fallback-photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
        .fallback-name { position: absolute; z-index: 3; bottom: 73px; left: 23px; background: #f7f9ff; color: #101c33; font-size: 11px; font-weight: 900; border-radius: 3px; border-left: 4px solid #3786ef; padding: 9px 10px; }
        .fallback-footer { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; margin-top: 11px; font-size: 14px; font-weight: 900; color: #fff; background: #183c78; border-radius: 4px; padding: 9px 8px; margin-inline: -6px; }
        .fallback-footer small { font-size: 8px; font-weight: 700; color: #cde1fc; }
        .fallback-strap { position: absolute; z-index: 4; left: 50%; top: -12%; width: 43px; height: 34%; transform: translateX(-50%); background: linear-gradient(90deg,#171c27,#293348 50%,#171c27); border-inline: 2px solid #414d64; }
        .fallback-strap span { display: block; position: absolute; white-space: nowrap; left: 50%; top: 55%; transform: translate(-50%,-50%) rotate(90deg); font-size: 10px; font-weight: 850; letter-spacing: 2px; }
        .fallback-clip { position: absolute; z-index: 5; top: 21%; left: 50%; width: 57px; height: 28px; transform: translate(-50%,-50%); border: 3px solid #1a1f2a; border-radius: 6px; background: linear-gradient(#e0e4ed,#8a95aa); }
        .fallback-small-ring { position: absolute; z-index: 6; top: 24%; left: 50%; width: 22px; height: 25px; transform: translate(-50%,-50%); border: 4px solid #d9dfe7; border-radius: 50%; }
        .fallback-large-ring { position: absolute; z-index: 7; top: 26.3%; left: 50%; width: 30px; height: 52px; transform: translate(-50%,-50%) rotate(9deg); border: 4px solid #cfd8e3; border-radius: 48%; }

        /* Tilt Controls & Scroll Reveal */
        .tilt-controls { display: none; }
        .percentage { font-size: clamp(84px, 11vw, 112px); font-weight: 820; letter-spacing: -.075em; font-variant-numeric: tabular-nums; line-height: 1; }
        .percentage span { font-size: .49em; margin-left: .08em; }
        .progress-bar-bg { width: min(280px, 64vw); height: 3px; margin: 22px 0 0; }
        @media (prefers-reduced-motion: no-preference) {
            .scroll-reveal:not(.is-visible) { opacity: 0; transform: translate3d(0, 38px, 0); filter: blur(6px); }
            .scroll-reveal { transition: opacity .88s cubic-bezier(.22,1,.36,1), transform 1.02s cubic-bezier(.22,1,.36,1), filter .82s ease; transition-delay: var(--reveal-delay, 0ms); will-change: opacity, transform, filter; }
            .scroll-reveal.is-visible { opacity: 1; transform: translate3d(0,0,0); filter: blur(0); }
        }

        /* About Showcase */
        .about-showcase { position: relative; z-index: 5; isolation: isolate; max-width: 1320px; margin: 0 auto; padding: clamp(145px, 21vh, 235px) 42px clamp(110px, 16vh, 185px); min-height: 100vh; overflow: hidden; }
        .about-showcase::after { content: ""; pointer-events: none; position: absolute; z-index: -1; inset: 0; background: radial-gradient(ellipse 50% 64% at 51% 74%, rgba(23, 49, 85, .22), transparent 72%); }
        .about-showcase-glow { position: absolute; left: -16%; top: 13%; width: 58%; height: 70%; background: radial-gradient(ellipse at center, rgba(21, 65, 132, .25), rgba(9, 30, 67, .10) 48%, transparent 72%); filter: blur(20px); pointer-events: none; }
        .about-heading { text-align: center; position: relative; z-index: 4; margin: 0 auto clamp(82px, 13vh, 158px); }
